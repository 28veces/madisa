version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artemadisa-db
    environment:
      POSTGRES_USER: madisa
      POSTGRES_PASSWORD: madisa123
      POSTGRES_DB: artemadisa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madisa"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
